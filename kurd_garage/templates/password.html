{% extends "base.html" %}{% from "_macros.html" import csrf_field with context %}
{% block content %}
<h1>Change password</h1>
<form method="post" class="card narrow">{{ csrf_field() }}
  <label>Current password <input type="password" name="old" required></label>
  <label>New password (6+ characters) <input type="password" name="new" required minlength="6"></label>
  <button>Save</button>
</form>
{% endblock %}
